version: '3.8'

services:
  wikipedia-retrieval:
    build: .
    container_name: wikipedia-movies-retrieval
    volumes:
      # Mount data directory (CSV files should be in ./data/)
      - ./data:/app/data
      # Mount index directories for persistence
      - ./idx_disk:/app/idx_disk
      - ./idx_upd:/app/idx_upd
      # Mount index_memory.pkl if needed
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true
    # Override command to run interactive shell
    command: /bin/bash

